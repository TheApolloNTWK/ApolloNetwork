name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, type-check, build, test, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Lifecycle scripts are not needed by this project; skipping them removes
      # a common supply-chain attack path.
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm audit --audit-level=low
      - run: npm run lint
      - run: npm run check
      - run: npm run build
      - run: npm test
