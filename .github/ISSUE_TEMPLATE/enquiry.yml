name: Enquiry
description: Ask about a project, a service, or APOLLO Network. This is public.
title: 'Enquiry: '
labels: ['enquiry']
body:
  - type: markdown
    attributes:
      value: |
        **This enquiry is public.** Anyone can read it. Do not include phone numbers,
        addresses, passwords, API keys or anything else you would not publish.
        If you need a private follow-up, say so and a private channel will be suggested.

        Security vulnerabilities must **not** be reported here — see the security policy.
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - A project or service enquiry
        - A question about APOLLO Network
        - Something else
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: What would you like to discuss?
      description: What are you trying to achieve? A few sentences is enough.
    validations:
      required: true
  - type: checkboxes
    id: public
    attributes:
      label: Confirmation
      options:
        - label: I understand this enquiry is public and contains nothing private.
          required: true
